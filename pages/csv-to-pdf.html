<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Từ Vựng - CSV Exporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Thư viện đọc CSV PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --primary-color: #f7a1b5;
            --primary-hover: #f4829d;
            --text-color: #4a3f44;
            --border-color: #fde2e8;
            --alt-row-bg: #fff0f3;
            --badge-bg: #ffe4eb;
            --badge-text: #d85d7c;
        }

        body {
            font-family: 'American Typewriter', 'Yuanti SC', '圆体', 'STYuanti', 'Huninn', 'jf open 粉圓', 'Noto Sans SC', 'Courier New', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            width: 100%;
            max-width: 1200px;
            background-color: var(--card-bg);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(247, 161, 181, 0.15);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-back {
            text-decoration: none;
            color: var(--badge-text);
            font-weight: bold;
            font-size: 14px;
            background: var(--badge-bg);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .mode-select, .sr-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
            color: var(--badge-text);
            cursor: pointer;
        }

        .btn-print {
            background-color: var(--badge-text);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-print:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(247, 161, 181, 0.15);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            overflow-x: auto;
        }

        h1 {
            text-align: center;
            color: #d85d7c;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Font Tiếng Trung to và rõ */
        .zh-text {
            font-family: 'Yuanti SC', '圆体', 'STYuanti', 'PingFang SC', 'Noto Sans SC', sans-serif;
            font-size: 17px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 8px;
            table-layout: fixed;
        }

        th {
            background-color: var(--primary-color) !important;
            color: #ffffff !important;
            font-weight: 600;
            text-align: left;
            padding: 10px 8px;
            font-size: 14px;
            position: relative;
            user-select: none;
            overflow: hidden;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            vertical-align: middle;
            word-wrap: break-word;
            overflow: hidden;
        }

        tr:nth-child(even) td {
            background-color: var(--alt-row-bg) !important;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Resizer handle cho các cột */
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 8px;
            background: rgba(255, 255, 255, 0.25);
            cursor: col-resize;
            user-select: none;
            z-index: 10;
        }

        .resizer:hover, .resizing {
            background: var(--badge-text);
        }

        .col-no {
            text-align: center;
            font-weight: bold;
            color: #b5838d;
        }

        .col-2 {
            font-weight: 600;
            font-size: 16px;
            line-height: 1.4;
        }

        .col-2.single-line {
            white-space: nowrap;
        }

        .col-2.multi-line {
            white-space: normal;
        }

        .col-3 {
            color: #8d5b68;
            font-size: 14px;
        }

        .col-pos {
            text-align: center;
        }

        .col-5 {
            color: #6a535d;
            font-size: 14px;
        }

        .col-example {
            font-size: 13.5px;
            color: #5c4a52;
            line-height: 1.4;
        }

        .col-meaning {
            color: #4a3f44;
            font-size: 14px;
        }

        .col-sr {
            text-align: center;
            font-weight: bold;
            color: var(--badge-text);
            border-left: 1px dashed var(--border-color);
            padding: 6px 2px;
        }

        .pos-badge {
            display: inline-block;
            background-color: var(--badge-bg) !important;
            color: var(--badge-text) !important;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .passage-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #fff0f3 !important;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .passage-title {
            font-weight: bold;
            color: #d85d7c;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .passage-content {
            line-height: 1.7;
            font-size: 15px;
        }

        /* CONFIG DÀNH RIÊNG CHO PRINT / XUẤT PDF */
        @page {
            size: A4 landscape;
            margin: 10mm;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .controls {
                display: none !important;
            }

            .container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            table {
                width: 100% !important;
                table-layout: auto !important; /* Tự co giãn cột vừa khít trang */
            }

            th, td {
                padding: 8px 6px !important;
            }

            .resizer {
                display: none !important;
            }

            tr {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Control bar -->
    <div class="controls">
        <div class="controls-left">
            <a href="../index.html" class="btn-back">← Planner</a>
            
            <label for="col2Mode"><b>Loại: </b></label>
            <select id="col2Mode" class="mode-select" onchange="renderTable()">
                <option value="chinese">Tiếng Trung</option>
                <option value="english" selected>Tiếng Anh</option>
            </select>

            <label for="userRole"><b>Chế độ xem: </b></label>
            <select id="userRole" class="mode-select" onchange="renderTable()">
                <option value="teacher">Giáo viên (Đủ cột)</option>
                <option value="student" selected>Học sinh (Ẩn dịch)</option>
            </select>

            <label class="checkbox-group">
                <input type="checkbox" id="srToggle" checked onchange="toggleSRControls()"> Ôn tập (SR)
            </label>
            
            <span id="srRangeWrapper">
                <label for="srDays"><b>Số ngày: </b></label>
                <select id="srDays" class="sr-select" onchange="renderTable()">
                    <option value="1">1 ngày</option>
                    <option value="2">2 ngày</option>
                    <option value="3">3 ngày</option>
                    <option value="4">4 ngày</option>
                    <option value="5">5 ngày</option>
                    <option value="6">6 ngày</option>
                    <option value="7" selected>7 ngày</option>
                </select>
            </span>

            <label for="csvInput"><b>Tải CSV: </b></label>
            <input type="file" id="csvInput" accept=".csv">
        </div>
        <button class="btn-print" onclick="window.print()">🖨️ In / Tải PDF</button>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1 id="pageTitle">BẢNG TỪ VỰNG TIẾNG ANH</h1>
        <table id="vocabTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="vocabBody"></tbody>
        </table>

        <div class="passage-box" id="passageBox" style="display: none;">
            <div class="passage-title">Trích đoạn văn trong yêu cầu:</div>
            <div class="passage-content zh-text" id="passageContent"></div>
        </div>
    </div>

    <script>
        let cachedParsedData = [
            {
                English: 'door to door; house by house',
                Chinese: '挨家挨户',
                Pinyin: '/āijiā-āihù/',
                POS: '(idi)',
                Example: '志愿者挨家挨户发宣讲资料。',
                Vietnamese: 'từng nhà từng hộ, từng nhà một'
            },
            {
                English: 'to love something so much that one cannot put it down',
                Chinese: '爱不释手',
                Pinyin: '/àibúshìshǒu/',
                POS: '(idi)',
                Example: '他对这本书爱不释手。',
                Vietnamese: 'yêu thích không lỡ rời tay'
            }
        ];

        document.getElementById('csvInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    cachedParsedData = results.data;
                    
                    if (cachedParsedData.length > 0) {
                        const sample = cachedParsedData[0];
                        if (sample['Chinese'] || sample['生词'] || sample['Chữ Hán']) {
                            document.getElementById('col2Mode').value = 'chinese';
                        } else if (sample['English'] || sample['Vocabulary']) {
                            document.getElementById('col2Mode').value = 'english';
                        }
                    }
                    renderTable();
                }
            });
        });

        function toggleSRControls() {
            const isChecked = document.getElementById('srToggle').checked;
            document.getElementById('srRangeWrapper').style.display = isChecked ? 'inline-block' : 'none';
            renderTable();
        }

        function countWords(str) {
            if (!str) return 0;
            return str.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function renderTable() {
            const mode = document.getElementById('col2Mode').value;
            const role = document.getElementById('userRole').value;
            const srEnabled = document.getElementById('srToggle').checked;
            const srDays = parseInt(document.getElementById('srDays').value) || 7;

            const pageTitle = document.getElementById('pageTitle');
            const tableHeader = document.getElementById('tableHeader');
            const tbody = document.getElementById('vocabBody');

            pageTitle.textContent = mode === 'english' ? "BẢNG TỪ VỰNG TIẾNG ANH" : "BẢNG TỪ VỰNG TIẾNG TRUNG";

            let headerList = [
                { name: 'NO', width: '40px' }
            ];

            if (mode === 'english') {
                headerList.push({ name: 'Vocabulary', width: '200px' });
                headerList.push({ name: 'Pronunciation', width: '130px' });
                headerList.push({ name: 'POS', width: '60px' });
                if (role === 'teacher') headerList.push({ name: 'Chinese', width: '140px' });
                headerList.push({ name: 'Example', width: '230px' });
                headerList.push({ name: 'Meaning', width: '160px' });
            } else {
                headerList.push({ name: '生词', width: '160px' });
                headerList.push({ name: '拼音', width: '130px' });
                headerList.push({ name: '词类', width: '60px' });
                if (role === 'teacher') headerList.push({ name: 'English', width: '180px' });
                headerList.push({ name: '例如', width: '230px' });
                headerList.push({ name: '含义', width: '160px' });
            }

            if (srEnabled) {
                for (let d = 1; d <= srDays; d++) {
                    headerList.push({ name: `D${d}`, width: '28px', class: 'col-sr' });
                }
            }

            tableHeader.innerHTML = headerList.map(h => `
                <th style="width: ${h.width};" class="${h.class || ''}">
                    ${h.name}
                    <div class="resizer"></div>
                </th>
            `).join('');

            makeAllColumnsResizable();

            tbody.innerHTML = '';
            let passage = '';

            cachedParsedData.forEach((row, index) => {
                const rawChinese = row['Chinese'] || row['chinese'] || row['生词'] || row['Chữ Hán'] || '';
                let rawPinyin = row['Pinyin'] || row['pinyin'] || row['IPA'] || row['Pronunciation'] || row['拼音'] || '';
                const rawPos = row['POS'] || row['pos'] || row['词类'] || row['Từ loại'] || '';
                const rawEnglish = row['English'] || row['english'] || row['Vocabulary'] || '';
                const rawExample = row['Example'] || row['example'] || row['例如'] || row['Ví dụ'] || '';
                let rawVietnamese = row['Vietnamese'] || row['vietnamese'] || row['Meaning'] || row['meaning'] || row['含义'] || row['Ý nghĩa'] || '';

                if (row.passage || row['passage_text'] || row['Đoạn văn']) {
                    passage = row.passage || row['passage_text'] || row['Đoạn văn'];
                }

                if (rawPinyin && !rawPinyin.startsWith('/')) rawPinyin = '/' + rawPinyin;
                if (rawPinyin && !rawPinyin.endsWith('/')) rawPinyin = rawPinyin + '/';
                if (rawVietnamese) rawVietnamese = rawVietnamese.toLowerCase();

                let mainWord = mode === 'english' ? (rawEnglish || rawChinese) : (rawChinese || rawEnglish);
                let wordCount = mode === 'english' ? countWords(mainWord) : mainWord.length;
                let lineClass = wordCount <= 6 ? 'single-line' : 'multi-line';

                let rowHtml = `<td class="col-no">${index + 1}</td>`;

                if (mode === 'english') {
                    rowHtml += `<td class="col-2 ${lineClass}">${rawEnglish || rawChinese}</td>`;
                    rowHtml += `<td class="col-3">${rawPinyin}</td>`;
                    rowHtml += `<td class="col-pos"><span class="pos-badge">${rawPos}</span></td>`;
                    if (role === 'teacher') rowHtml += `<td class="col-5 zh-text">${rawChinese}</td>`;
                    rowHtml += `<td class="col-example zh-text">${rawExample}</td>`;
                    rowHtml += `<td class="col-meaning">${rawVietnamese}</td>`;
                } else {
                    rowHtml += `<td class="col-2 zh-text ${lineClass}">${rawChinese || rawEnglish}</td>`;
                    rowHtml += `<td class="col-3">${rawPinyin}</td>`;
                    rowHtml += `<td class="col-pos"><span class="pos-badge">${rawPos}</span></td>`;
                    if (role === 'teacher') rowHtml += `<td class="col-5">${rawEnglish}</td>`;
                    rowHtml += `<td class="col-example zh-text">${rawExample}</td>`;
                    rowHtml += `<td class="col-meaning">${rawVietnamese}</td>`;
                }

                if (srEnabled) {
                    for (let d = 1; d <= srDays; d++) {
                        rowHtml += `<td class="col-sr"></td>`;
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });

            const passageBox = document.getElementById('passageBox');
            const passageContent = document.getElementById('passageContent');
            if (passage.trim() !== '') {
                passageContent.textContent = passage;
                passageBox.style.display = 'block';
            } else {
                passageBox.style.display = 'none';
            }
        }

        function makeAllColumnsResizable() {
            const cols = document.querySelectorAll('th');
            cols.forEach(col => {
                const resizer = col.querySelector('.resizer');
                if (!resizer) return;

                let x = 0;
                let w = 0;

                const mouseDownHandler = function (e) {
                    x = e.clientX;
                    const styles = window.getComputedStyle(col);
                    w = parseInt(styles.width, 10);

                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                    resizer.classList.add('resizing');
                };

                const mouseMoveHandler = function (e) {
                    const dx = e.clientX - x;
                    col.style.width = `${Math.max(20, w + dx)}px`;
                };

                const mouseUpHandler = function () {
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                    resizer.classList.remove('resizing');
                };

                resizer.addEventListener('mousedown', mouseDownHandler);
            });
        }

        renderTable();
    </script>
</body>
</html>
