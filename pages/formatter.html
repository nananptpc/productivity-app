<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>南芳 format studio</title>
    <!-- Link Google Fonts chuẩn theo quy tắc -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fff0f6;
            --text: #3f3037;
            --card: #fffafb;
            --border: #f3b8c8;
            --accent: #ee7fa1;
            --accent2: #ffc1d1;
            --shadow: 0 6px 22px rgba(229, 103, 139, 0.18);
            --font: 'American Typewriter', 'Yuanti SC', '圆体', 'STYuanti', 'Huninn', 'jf open 粉圓', 'Noto Sans SC', 'Courier New', monospace;
            --radius: 8px;
        }
        body.dark {
            --bg: #2d2428;
            --text: #f5e6ea;
            --card: #3d3238;
            --border: #5a454c;
            --accent: #d47b92;
            --accent2: #a06275;
            --shadow: 0 4px 16px rgba(0,0,0,0.35);
        }
        body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 16px; }
        button, input, select, textarea { font-family: inherit; }
        .container { max-width: 1400px; margin: 0 auto; }
        header, .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
        header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        h1 { font-size: 28px; }
        h2 { font-size: 16px; margin-bottom: 8px; }
        .hint { color: color-mix(in srgb, var(--text), transparent 32%); font-size: 12px; line-height: 1.45; margin-top: 3px; }
        .nav, .toolbar, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .nav a, button { background: var(--accent2); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--text); cursor: pointer; padding: 8px 12px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .nav a:hover, button:hover { background: var(--accent); color: white; }
        button.primary { background: var(--accent); color: white; font-weight: 800; }
        button.active { background: var(--accent); color: white; font-weight: 800; }
        .layout { display: grid; gap: 14px; grid-template-columns: 350px 1fr; }
        .stack { display: grid; gap: 12px; }
        input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); min-width: 0; padding: 8px 10px; width: 100%; font-size: 13px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { min-height: 200px; resize: vertical; }
        label { display: grid; gap: 4px; font-size: 11px; font-weight: 800; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; user-select: none; }
        .checkbox-label input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
        .preset-buttons { display: grid; gap: 6px; margin-top: 8px; }
        .preset-buttons button { padding: 7px 10px; font-size: 12px; }
        .preset-buttons button.active { background: var(--accent); color: white; }
        details { margin-top: 8px; }
        summary { cursor: pointer; font-weight: 800; color: var(--accent); user-select: none; font-size: 13px; }
        .details-content { margin-top: 8px; padding: 10px; background: color-mix(in srgb, var(--bg), white 3%); border-radius: var(--radius); display: grid; gap: 8px; }
        .details-content label { margin-bottom: 2px; }
        .preview-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); min-height: 400px; max-height: 700px; overflow: auto; padding: 16px; position: relative; }
        
        .doc-preview { background: var(--card); color: var(--text); font-size: 14px; line-height: 1.6; max-width: 100%; margin: 0 auto; padding: 24px; position: relative; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .doc-preview-content { width: 100%; }
        
        /* HEADER CĂN GIỮA VÀ ĐƯỜNG PHÂN CÁCH DẤU DASH MỜ */
        .custom-header {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--border);
            color: var(--text);
        }
        
        .doc-preview h2 { font-size: 28px; line-height: 1.2; margin-bottom: 24px; text-align: center; color: var(--text); }
        .doc-item { margin-bottom: 8px; overflow-wrap: anywhere; }
        .doc-item .num { font-weight: 800; margin-right: 6px; color: var(--accent); }
        .mcq-item { margin-bottom: 18px; }
        .mcq-item .question { font-weight: 800; margin-bottom: 8px; }
        .mcq-item .options { margin-left: 20px; }
        .mcq-item .option { margin-bottom: 4px; }
        
        /* ĐÃ SỬA: Cho phép nội dung chảy tự nhiên tới cuối trang, ngắt trang linh hoạt */
        .fill-section { 
            margin-bottom: 28px; 
            width: 100%;
        }
        .word-bank-row { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 20px; 
            font-size: 15px; 
            flex-wrap: wrap; 
            break-after: avoid-page; 
            page-break-after: avoid; 
            background: var(--bg);
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .word-bank-title { font-weight: 800; font-size: 15px; white-space: nowrap; color: var(--accent); }
        .word-bank-items { font-weight: 700; letter-spacing: 0.5px; }
        .fill-item { 
            margin-bottom: 14px; 
            display: flex; 
            align-items: baseline; 
            width: 100%;
        }
        .fill-item .num { font-weight: 800; min-width: 28px; color: var(--accent); flex-shrink: 0; }
        .fill-item .text { flex: 1; width: 100%; word-break: break-word; }

        .sheet-preview { border-collapse: collapse; width: 100%; color: var(--text); background: var(--card); border-radius: var(--radius); overflow: hidden; }
        .sheet-preview th { background: var(--accent2); border: 1px solid var(--border); padding: 10px; text-align: left; font-weight: 800; color: var(--text); }
        .sheet-preview td { background: var(--card); border: 1px solid var(--border); padding: 8px 10px; }
        .sheet-preview tr:nth-child(even) td { background: var(--bg); }
        .stats { font-size: 12px; color: color-mix(in srgb, var(--text), transparent 25%); }
        
        .preview-footer {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            text-align: center;
            font-size: 12px;
            color: color-mix(in srgb, var(--text), transparent 40%);
            width: 100%;
            display: block;
        }

        @media (max-width: 1000px) {
            .layout { grid-template-columns: 1fr; }
        }

        /* QUY TẮC IN ẤN & XUẤT PDF */
        @page {
            size: auto;
            margin: 15mm 15mm 20mm 15mm;
            @bottom-center {
                content: var(--page-counter-content, "");
                font-family: 'American Typewriter', 'Yuanti SC', 'Noto Sans SC', sans-serif;
                font-size: 10pt;
                color: #666;
                text-align: center;
            }
        }
        @media print {
            body { background: white; padding: 0; color: #3f3037; }
            header, .stack, .toolbar, .preview-footer { display: none !important; }
            .layout { display: block; grid-template-columns: 1fr; }
            .card { border: 0; box-shadow: none; padding: 0; background: transparent; }
            .preview-wrap { border: 0; padding: 0; background: white; max-height: none; overflow: visible; }
            .doc-preview { max-width: none; padding: 0; background: white; min-height: auto; border: 0; box-shadow: none; color: #3f3037; }
            .sheet-preview { min-width: auto; }
            .word-bank-row { background: #fff0f6; border: 1px solid #f3b8c8; }
        }
    </style>
    <link rel="stylesheet" href="./ui-cleanup.css" />
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🧾 南芳 format studio</h1>
                <p class="hint">Paste text, upload CSV for MCQ/worksheet/Fill Blank</p>
            </div>
            <nav class="nav">
                <a href="../index.html">Home</a>
                <a href="./teaching.html">Teaching</a>
                <button id="langBtn" title="Chuyển chế độ Ngôn ngữ">EN</button>
                <button id="themeBtn">Theme</button>
            </nav>
        </header>

        <main class="layout">
            <section class="stack">
                <div class="card">
                    <h2>Input</h2>
                    <textarea id="rawInput" placeholder="Paste text or copy from CSV..."></textarea>
                    <div class="actions" style="margin-top: 8px;">
                        <button class="primary" id="formatBtn">Format</button>
                        <button onclick="document.getElementById('csvFile').click()">Upload CSV</button>
                        <input type="file" id="csvFile" accept=".csv,.tsv" style="display:none" />
                        <button id="sampleBtn">Sample MCQ</button>
                        <button id="sampleFillBtn">Sample Fill Blank</button>
                        <button id="clearBtn">Clear</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Mode</h2>
                    <div class="preset-buttons">
                        <button class="preset active" data-mode="doc">Doc</button>
                        <button class="preset" data-mode="mcq">MCQ</button>
                        <button class="preset" data-mode="fill">Fill Blank</button>
                        <button class="preset" data-mode="sheet">Sheet</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Settings</h2>
                    <label>Header Text (Căn giữa)
                        <input id="headerInput" value="" placeholder="Nhập header ở đây (ví dụ: HSK4 - Bài tập)" />
                    </label>
                    <label style="margin-top: 6px;">Title
                        <input id="titleInput" value="Practice" />
                    </label>
                    <label style="margin-top: 6px;">Split by
                        <select id="splitMode">
                            <option value="line">Line</option>
                            <option value="numbered">Numbered (1. 2. 3.)</option>
                            <option value="blank">Blank line</option>
                        </select>
                    </label>
                    <label style="margin-top: 6px;">Show item numbers
                        <select id="numbering">
                            <option value="yes" selected>Yes</option>
                            <option value="no">No</option>
                        </select>
                    </label>

                    <!-- Chức năng Bật/Tắt Đánh số trang & Số trang bắt đầu -->
                    <div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); display: grid; gap: 8px;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showPageNumbers" checked />
                            <span>Show page numbers (Footer)</span>
                        </label>
                        <label id="startPageLabel">Start page number
                            <input id="startPageNumber" type="number" value="1" min="1" style="max-width: 80px;" />
                        </label>
                    </div>
                </div>

                <details>
                    <summary>More Options ▼</summary>
                    <div class="details-content">
                        <label>Columns
                            <select id="columnCount">
                                <option value="1">1</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                            </select>
                        </label>
                        <label>Blank length
                            <input id="blankLength" type="number" value="12" style="max-width: 80px;" />
                        </label>
                        <label>Start item number
                            <input id="startNumber" type="number" value="1" style="max-width: 80px;" />
                        </label>
                        <label>Font size
                            <select id="fontSize">
                                <option value="12px">Small</option>
                                <option value="14px" selected>Normal</option>
                                <option value="16px">Large</option>
                            </select>
                        </label>
                        <label>Line spacing
                            <select id="lineSpacing">
                                <option value="1.4">Tight</option>
                                <option value="1.6" selected>Normal</option>
                                <option value="2">Roomy</option>
                            </select>
                        </label>
                    </div>
                </details>
            </section>

            <section class="card">
                <div class="toolbar" style="justify-content: space-between; margin-bottom: 10px;">
                    <p class="stats" id="stats">0 items</p>
                    <div class="actions">
                        <button id="copyBtn">Copy</button>
                        <button id="csvExportBtn">Export CSV</button>
                        <button id="printBtn">Print</button>
                    </div>
                </div>
                <div class="preview-wrap" id="preview"></div>
            </section>
        </main>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let mode = 'doc';
        let lang = 'en';
        let rows = [];
        let fillSections = [];

        document.body.classList.toggle('dark', localStorage.getItem('appTheme') === 'dark');
        $('themeBtn').onclick = () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('appTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
        };

        $('langBtn').onclick = () => {
            lang = lang === 'en' ? 'zh' : 'en';
            $('langBtn').textContent = lang.toUpperCase();
            render();
        };

        function escapeHTML(val) {
            return String(val || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function parseCSV(text) {
            const lines = (text || '').split(/\r?\n/);
            if (!lines.length) return [];

            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    if (currentRow.some(cell => cell.length > 0)) {
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                    if (char === '\r' && nextChar === '\n') i++;
                } else {
                    currentCell += char;
                }
            }

            if (currentCell.length > 0 || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                if (currentRow.some(cell => cell.length > 0)) {
                    rows.push(currentRow);
                }
            }

            return rows;
        }

        function importCSV(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                const table = parseCSV(event.target.result);

                if (table.length < 2) {
                    alert('CSV phải có header row + data rows');
                    return;
                }

                const headers = table[0].map(h => h.toLowerCase());

                const qIdx = headers.findIndex(h => h.includes('question') || h.includes('stem') || h.includes('prompt') || h.includes('content'));
                const aIdx = headers.findIndex(h => h === 'a');
                const bIdx = headers.findIndex(h => h === 'b');
                const cIdx = headers.findIndex(h => h === 'c');
                const dIdx = headers.findIndex(h => h === 'd');
                const wbIdx = headers.findIndex(h => h.includes('wordbank') || h.includes('words') || h.includes('bank') || h.includes('词库') || h.includes('选词'));

                if (wbIdx >= 0) {
                    mode = 'fill';
                    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('active', b.dataset.mode === 'fill'));

                    const defaultBankTitle = lang === 'zh' ? '选词填空' : 'Word Bank';
                    const groups = {};
                    table.slice(1).forEach((row) => {
                        const bank = row[wbIdx] ? row[wbIdx].trim() : defaultBankTitle;
                        const q = row[qIdx >= 0 ? qIdx : 0] ? row[qIdx >= 0 ? qIdx : 0].trim() : '';
                        if (!q) return;
                        if (!groups[bank]) groups[bank] = [];
                        groups[bank].push(q);
                    });

                    let rawText = '';
                    const prefix = lang === 'zh' ? '选词填空:' : 'Word Bank:';
                    Object.keys(groups).forEach(bank => {
                        rawText += `${prefix} ${bank}\n` + groups[bank].join('\n') + '\n\n';
                    });

                    $('rawInput').value = rawText.trim();
                    render();
                    alert(`✓ Imported nhiều nhóm ${lang === 'zh' ? '选词填空' : 'Word Bank'} từ CSV thành công!`);
                    return;
                }

                if (qIdx >= 0 && aIdx >= 0 && bIdx >= 0 && cIdx >= 0 && dIdx >= 0) {
                    mode = 'mcq';
                    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('active', b.dataset.mode === 'mcq'));

                    rows = [];
                    table.slice(1).forEach((row) => {
                        const question = row[qIdx] ? row[qIdx].trim() : '';
                        if (!question) return;

                        rows.push({
                            no: rows.length + 1,
                            text: question,
                            a: row[aIdx] ? row[aIdx].trim() : '',
                            b: row[bIdx] ? row[bIdx].trim() : '',
                            c: row[cIdx] ? row[cIdx].trim() : '',
                            d: row[dIdx] ? row[dIdx].trim() : '',
                            answer: ''
                        });
                    });

                    render();
                    alert(`✓ Imported ${rows.length} MCQ questions`);
                } else {
                    const colIdx = qIdx >= 0 ? qIdx : 0;
                    $('splitMode').value = 'line';$('rawInput').value = table.slice(1).map(row => row[colIdx] ? row[colIdx].trim() : '').filter(Boolean).join('\n');
                    render();
                    alert(`✓ Imported ${table.length - 1} rows`);
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        function cleanLine(line) {
            return line.replace(/^\s*\d+[\).、:-]\s*/, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function splitText() {
            const raw = $('rawInput').value.trim();
            const splitMode = $('splitMode').value;
            if (!raw) return [];

            if (splitMode === 'blank') return raw.split(/\n\s*\n/).map(cleanLine).filter(Boolean);
            return raw.split(/\r?\n/).map(cleanLine).filter(Boolean);
        }

        function buildRows() {
            if (mode === 'mcq') return;

            const raw = $('rawInput').value.trim();
            const start = Number($('startNumber').value) || 1;
            const blankLen = Number($('blankLength').value) || 12;
            const blank = '_'.repeat(Math.max(3, blankLen));

            if (mode === 'fill') {
                fillSections = [];
                const wbRegex = /(word\s*bank|选词填空|词库|词汇)\s*:/i;
                const standaloneWbRegex = /^\s*(word\s*bank|选词填空|词库|词汇)\s*$/i;
                
                if (wbRegex.test(raw)) {
                    const splitRegex = new RegExp(`(?=${wbRegex.source})`, 'i');
                    const parts = raw.split(splitRegex).filter(Boolean);
                    let currentNum = start;

                    parts.forEach(part => {
                        const lines = part.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                        let bankText = '';
                        const items = [];

                        lines.forEach(line => {
                            if (wbRegex.test(line)) {
                                bankText = line.replace(new RegExp(`^${wbRegex.source}\\s*`, 'i'), '').trim();
                            } else {
                                const clean = cleanLine(line);
                                if (clean && !standaloneWbRegex.test(clean)) {
                                    const hasBlank = /_{3,}/.test(clean);
                                    items.push({
                                        no: currentNum++,
                                        text: hasBlank ? clean.replace(/_{3,}/g, blank) : clean.replace(/\(([^)]+)\)/, '($1) ' + blank)
                                    });
                                }
                            }
                        });

                        if (items.length > 0) {
                            fillSections.push({ bank: bankText, items });
                        }
                    });
                    return;
                } else {
                    const filteredLines = splitText().filter(text => !standaloneWbRegex.test(text));
                    
                    const items = filteredLines.map((text, i) => {
                        const hasBlank = /_{3,}/.test(text);
                        return {
                            no: start + i,
                            text: hasBlank ? text.replace(/_{3,}/g, blank) : text.replace(/\(([^)]+)\)/, '($1) ' + blank),
                        };
                    });
                    fillSections = [{ bank: '', items }];
                    return;
                }
            }

            const items = splitText();
            rows = items.map((text, i) => {
                const num = start + i;
                const hasBlank = /_{3,}/.test(text);
                return {
                    no: num,
                    text: hasBlank ? text.replace(/_{3,}/g, blank) : text.replace(/\(([^)]+)\)/, '($1) ' + blank),
                };
            });
        }

        function renderHeader() {
            const headerVal = $('headerInput').value.trim();
            if (!headerVal) return '';
            return `<div class="custom-header">${escapeHTML(headerVal)}</div>`;
        }

        function renderFooter() {
            const showPages = $('showPageNumbers').checked;
            if (!showPages) {
                document.documentElement.style.setProperty('--page-counter-content', '""');
                return '';
            }
            
            const startPage = Number($('startPageNumber').value) || 1;
            document.documentElement.style.setProperty('--page-counter-content', `counter(page, decimal-leading-zero)`);

            const formattedPage = String(startPage).padStart(2, '0');
            return `<div class="preview-footer">${formattedPage}</div>`;
        }

        function renderDoc() {
            const title = escapeHTML($('titleInput').value);
            const cols = Number($('columnCount').value) || 1;
            const showNum = $('numbering').value === 'yes';
            const lineH = $('lineSpacing').value;
            const fontSize = $('fontSize').value;

            let html = `<div class="doc-preview" style="line-height: ${lineH}; font-size: ${fontSize};"><div class="doc-preview-content">`;
            html += renderHeader();
            if (title) html += `<h2>${title}</h2>`;

            const chunks = [];
            for (let i = 0; i < rows.length; i += cols) chunks.push(rows.slice(i, i + cols));

            chunks.forEach(group => {
                html += `<div style="display: grid; grid-template-columns: repeat(${cols}, 1fr); gap: 18px; margin-bottom: 10px; width: 100%;">`;
                group.forEach(row => {
                    html += `<div class="doc-item">
                        ${showNum ? `<span class="num">${row.no}.</span>` : ''}
                        ${escapeHTML(row.text)}
                    </div>`;
                });
                html += `</div>`;
            });

            html += `</div>${renderFooter()}</div>`;
            $('preview').innerHTML = html;
        }

        function renderMCQ() {
            const title = escapeHTML($('titleInput').value);
            let html = `<div class="doc-preview"><div class="doc-preview-content">`;
            html += renderHeader();
            if (title) html += `<h2>${title}</h2>`;

            rows.forEach(row => {
                html += `<div class="mcq-item">
                    <div class="question">${row.no}. ${escapeHTML(row.text)}</div>
                    <div class="options">
                        <div class="option"><strong>A)</strong> ${escapeHTML(row.a)}</div>
                        <div class="option"><strong>B)</strong> ${escapeHTML(row.b)}</div>
                        <div class="option"><strong>C)</strong> ${escapeHTML(row.c)}</div>
                        <div class="option"><strong>D)</strong> ${escapeHTML(row.d)}</div>
                    </div>
                </div>`;
            });

            html += `</div>${renderFooter()}</div>`;
            $('preview').innerHTML = html;
        }

        function renderFillBlank() {
            const title = escapeHTML($('titleInput').value);
            const showNum = $('numbering').value === 'yes';
            const lineH = $('lineSpacing').value;
            const fontSize = $('fontSize').value;
            const bankTitle = lang === 'zh' ? '选词填空:' : 'Word Bank:';

            let html = `<div class="doc-preview" style="line-height: ${lineH}; font-size: ${fontSize};"><div class="doc-preview-content">`;
            html += renderHeader();
            if (title) html += `<h2>${title}</h2>`;

            fillSections.forEach(sec => {
                html += `<div class="fill-section">`;
                if (sec.bank) {
                    html += `
                    <div class="word-bank-row">
                        <span class="word-bank-title">${bankTitle}</span>
                        <span class="word-bank-items">${escapeHTML(sec.bank)}</span>
                    </div>`;
                }

                sec.items.forEach(row => {
                    html += `<div class="fill-item">
                        ${showNum ? `<div class="num">${row.no}.</div>` : ''}
                        <div class="text">${escapeHTML(row.text)}</div>
                    </div>`;
                });
                html += `</div>`;
            });

            html += `</div>${renderFooter()}</div>`;
            $('preview').innerHTML = html;
        }

        function renderSheet() {
            let html = `<table class="sheet-preview"><thead><tr>
                <th>No</th><th>Content</th><th>Answer</th><th>Note</th>
            </tr></thead><tbody>`;

            const list = mode === 'fill' ? fillSections.flatMap(s => s.items) : rows;
            list.forEach(row => {
                html += `<tr><td>${row.no}</td><td>${escapeHTML(row.text)}</td><td></td><td></td></tr>`;
            });

            html += `</tbody></table>`;
            $('preview').innerHTML = html;
        }

        function render() {
            buildRows();
            const totalItems = mode === 'fill' ? fillSections.reduce((acc, s) => acc + s.items.length, 0) : rows.length;
            $('stats').textContent = `${totalItems} items`;

            if (mode === 'doc') renderDoc();
            else if (mode === 'mcq') renderMCQ();
            else if (mode === 'fill') renderFillBlank();
            else renderSheet();
        }

        $('showPageNumbers').addEventListener('change', (e) => {$('startPageLabel').style.display = e.target.checked ? 'grid' : 'none';
            render();
        });

        document.querySelectorAll('.preset').forEach(btn => btn.addEventListener('click', () => {
            mode = btn.dataset.mode;
            document.querySelectorAll('.preset').forEach(b =>
                b.classList.toggle('active', b === btn)
            );
            render();
        }));

        $('formatBtn').onclick = render;
        
        $('sampleBtn').onclick = () => {
            mode = 'mcq';
            document.querySelectorAll('.preset').forEach(b =>
                b.classList.toggle('active', b.dataset.mode === 'mcq')
            );
            $('rawInput').value = '';
            if (lang === 'zh') {
                rows = [
                    { no: 1, text: '“苹果”的拼音是什么？', a: 'píngguǒ', b: 'píngguō', c: 'pǐngguǒ', d: 'píngguò', answer: 'A' },
                    { no: 2, text: '中国的首都在哪里？', a: '上海', b: '广州', c: '北京', d: '深圳', answer: 'C' }
                ];
            } else {
                rows = [
                    { no: 1, text: 'What is 2 + 2?', a: '3', b: '4', c: '5', d: '6', answer: 'B' },
                    { no: 2, text: 'Capital of France?', a: 'London', b: 'Berlin', c: 'Paris', d: 'Madrid', answer: 'C' }
                ];
            }
            render();
        };

        $('sampleFillBtn').onclick = () => {
            mode = 'fill';
            document.querySelectorAll('.preset').forEach(b =>
                b.classList.toggle('active', b.dataset.mode === 'fill')
            );

            if (lang === 'zh') {
                $('rawInput').value = `选词填空: 苹果 — 大象 — 学校 — 老师 — 学习
1. 我在 ___________ 学习汉语，这里的环境很好。
2. 他是一位非常负责任的 ___________。
3. 这里的 ___________ 又甜又香，非常好吃。
4. ___________ 是陆地上体型最大的动物。
5. 每天 ___________ 新词汇能提高语言水平。

选词填空: 喝 — 听 — 读 — 写
6. 我喜欢边 ___________ 音乐边做作业。
7. 早上喝一杯 ___________ 对身体很好。`;
            } else {
                $('rawInput').value = `Word Bank: same — heavy — subject — uniform — smart
1. My favorite ___________ at school is English because I like talking to foreign friends.
2. We go to the same school, so we wear the ___________ every day.
3. Anna is a very ___________ student; she always gets high marks in math.
4. I cannot carry this bag by myself because it is too ___________.
5. Tom and I have the ___________ shoes. They look exactly identical!

Word Bank: cat — dog — milk — fish
6. The ___________ loves to eat fish.
7. I drink a glass of ___________ every morning.`;
            }
            render();
        };

        $('clearBtn').onclick = () => { $('rawInput').value = ''; rows = []; fillSections = []; render(); };$('csvFile').onchange = e => importCSV(e.target.files[0]);

        $('copyBtn').onclick = () => {
            const el = $('preview');
            const range = document.createRange();
            range.selectNodeContents(el);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            $('stats').textContent = 'Copied!';
            setTimeout(() => {
                const totalItems = mode === 'fill' ? fillSections.reduce((acc, s) => acc + s.items.length, 0) : rows.length;
                $('stats').textContent = `${totalItems} items`;
            }, 1500);
        };

        $('csvExportBtn').onclick = () => {
            if (!rows.length && !fillSections.length) render();
            const headers = mode === 'mcq' ? ['No', 'Question', 'A', 'B', 'C', 'D'] : ['No', 'Content'];
            const lines = [headers.join(',')];

            const list = mode === 'fill' ? fillSections.flatMap(s => s.items) : rows;

            list.forEach(row => {
                if (mode === 'mcq') {
                    lines.push(`${row.no},"${row.text.replace(/"/g, '""')}","${row.a.replace(/"/g, '""')}","${row.b.replace(/"/g, '""')}","${row.c.replace(/"/g, '""')}","${row.d.replace(/"/g, '""')}"`);
                } else {
                    lines.push(`${row.no},"${row.text.replace(/"/g, '""')}"`);
                }
            });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv' }));
            link.download = 'formatted.csv';
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 0);
        };

        $('printBtn').onclick = () => window.print();

        ['rawInput', 'headerInput', 'titleInput', 'splitMode', 'columnCount', 'numbering', 'blankLength', 'startNumber', 'lineSpacing', 'fontSize', 'startPageNumber'].forEach(id => {
            const el = $(id);
            if (el) el.addEventListener(id === 'rawInput' || id === 'headerInput' ? 'input' : 'change', render);
        });

        render();
    </script>
</body>
</html>
