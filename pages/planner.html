<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #fff0f6;
            --text: #3f3037;
            --card: #fffafb;
            --shadow: 0 6px 22px rgba(229, 103, 139, 0.18);
            --border: #f3b8c8;
            --accent: #ee7fa1;
            --accent2: #ffc1d1;
            --font: 'American Typewriter', 'Yuanti SC', '圆体', 'STYuanti', 'Huninn', 'jf open 粉圓', 'Noto Sans SC', 'Courier New', monospace;
            --font-zh: 'Yuanti SC', '圆体', 'STYuanti', 'PingFang SC', 'Noto Sans SC', sans-serif;
            --radius: 8px;
            --danger: #e74c6f;
            --danger-hover: #c0392b;
        }
        body.dark {
            --bg: #2d2428;
            --text: #f5e6ea;
            --card: #3d3238;
            --shadow: 0 4px 16px rgba(0,0,0,0.4);
            --border: #5a454c;
            --accent: #d47b92;
            --accent2: #a06275;
            --danger: #e74c6f;
            --danger-hover: #ff6b81;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: flex-start;
            position: relative;
        }

        .left-panel {
            position: sticky;
            top: 20px;
            flex: 0 0 340px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-right: 4px;
        }
        .left-panel::-webkit-scrollbar {
            width: 5px;
        }
        .left-panel::-webkit-scrollbar-thumb {
            background: var(--accent2);
            border-radius: 3px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
            padding: 0 4px;
        }
        .header h1 {
            font-size: 26px;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            gap: 8px;
        }
        .lang-toggle, .theme-toggle {
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 40px;
            padding: 4px 12px;
            font-family: var(--font);
            cursor: pointer;
            color: var(--text);
            transition: 0.3s;
            font-size: 13px;
            font-weight: bold;
        }
        .lang-toggle:hover, .theme-toggle:hover {
            background: var(--accent);
            color: #fff;
        }

        .calendar-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            flex-shrink: 0;
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        .calendar-nav button {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-family: var(--font);
            transition: 0.2s;
            font-size: 14px;
        }
        .calendar-nav button:hover {
            background: var(--accent2);
            border-color: var(--accent);
        }
        .calendar-nav button:last-child {
            width: auto;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            background: var(--accent2);
            border-color: var(--accent);
        }
        .calendar-nav button:last-child:hover {
            background: var(--accent);
            color: #fff;
        }
        .month-label {
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            flex: 1;
            letter-spacing: 0.5px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 8px;
        }
        .day-name {
            text-align: center;
            font-size: 10px;
            opacity: 0.6;
            padding: 2px 0;
            font-weight: bold;
        }
        .calendar-day {
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: var(--font);
        }
        .calendar-day:hover {
            background: var(--accent2);
        }
        .calendar-day.today {
            background: var(--accent2);
            border: 2px solid var(--accent);
        }
        .calendar-day.selected {
            background: var(--accent);
            color: #fff;
            font-weight: bold;
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }

        .master-task-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            flex-shrink: 0;
        }
        .master-task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .master-task-header h3 {
            font-size: 14px;
            font-weight: bold;
        }
        .master-input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .master-input-container input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
        }
        .master-input-row {
            display: flex;
            gap: 6px;
        }
        .master-input-row input[type="date"] {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
        }
        .master-input-row button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-family: var(--font);
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }
        .master-input-row button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .master-task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .master-task-item {
            padding: 8px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }
        .master-task-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .master-task-title {
            font-size: 12px;
            font-weight: bold;
            word-break: break-word;
        }
        .master-task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            opacity: 0.8;
        }
        .countdown-badge {
            background: var(--accent2);
            color: var(--text);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            white-space: nowrap;
        }
        .countdown-badge.urgent {
            background: var(--danger);
            color: #fff;
        }

        .week-toggle-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .week-toggle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .week-toggle-header h3 {
            font-size: 14px;
            font-weight: 600;
        }
        .week-toggle-header .arrow {
            transition: transform 0.3s;
            font-size: 12px;
        }
        .week-toggle-header .arrow.open {
            transform: rotate(180deg);
        }
        .week-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .week-days.open {
            max-height: 200px;
            opacity: 1;
        }
        .week-day-btn {
            padding: 6px 4px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            cursor: pointer;
            font-family: var(--font);
            font-size: 11px;
            color: var(--text);
            transition: 0.2s;
        }
        .week-day-btn:hover {
            background: var(--accent2);
        }
        .week-day-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .week-day-btn .day-num {
            font-weight: bold;
            font-size: 14px;
            display: block;
        }
        .week-day-btn .day-name-short {
            font-size: 9px;
            opacity: 0.7;
        }

        .task-filter-section {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .task-filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .task-filter-header h3 {
            font-size: 14px;
            font-weight: 600;
        }
        .task-filter-header .arrow {
            transition: transform 0.3s;
            font-size: 12px;
        }
        .task-filter-header .arrow.open {
            transform: rotate(180deg);
        }
        .task-filter-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }
        .task-filter-body.open {
            max-height: 300px;
            opacity: 1;
            margin-top: 12px;
        }
        .filter-date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .filter-date-grid input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
            width: 100%;
        }
        .filter-date-grid input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .filter-actions button {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            cursor: pointer;
            font-family: var(--font);
            font-size: 12px;
            color: var(--text);
            transition: 0.2s;
        }
        .filter-actions button:hover {
            background: var(--accent2);
        }
        .filter-actions button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .filter-actions button.primary:hover {
            opacity: 0.8;
        }
        .filter-result {
            margin-top: 10px;
            font-size: 12px;
            color: color-mix(in srgb, var(--text), transparent 35%);
        }

        .dashboard-wrapper {
            flex: 1;
            overflow-x: auto;
            overflow-y: visible;
            padding: 0 4px 10px 4px;
            min-width: 0;
            scroll-behavior: smooth;
        }
        .dashboard-wrapper::-webkit-scrollbar {
            height: 8px;
        }
        .dashboard-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent2);
            border-radius: 4px;
        }
        .dashboard {
            display: flex;
            gap: 16px;
            padding: 4px 0;
            min-width: fit-content;
        }

        .day-column {
            flex: 0 0 300px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            max-height: 70vh;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            scroll-margin-left: 0px;
        }
        .day-column.deleting {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .day-column.highlight {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(238, 127, 161, 0.4);
        }

        .day-header {
            padding: 12px 14px;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .day-header-title {
            flex: 1;
            text-align: center;
        }
        body.zh-lang .day-header-title {
            font-family: var(--font-zh);
        }
        .section-actions {
            display: flex;
            gap: 4px;
        }
        .section-actions .delete-column-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.2s;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .section-actions .delete-column-btn:hover {
            background: var(--danger);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(231, 76, 111, 0.5);
        }

        .tasks-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tasks-container::-webkit-scrollbar {
            width: 6px;
        }
        .tasks-container::-webkit-scrollbar-thumb {
            background: var(--accent2);
            border-radius: 3px;
        }

        .task-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .task-input-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
        }
        .task-input-row input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .task-input-row button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-family: var(--font);
            font-size: 16px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .task-input-row button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .task-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .task-item.master-derived {
            border-left: 4px solid var(--accent);
        }
        .task-item.carried-over {
            border-left: 4px solid var(--danger);
        }
        .task-item:hover {
            border-color: var(--accent);
        }
        .task-item.done {
            opacity: 0.4;
        }
        .task-item.done .task-text {
            text-decoration: line-through;
        }
        .task-item-header {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
            margin-top: 2px;
        }
        .task-text {
            flex: 1;
            font-size: 13px;
            word-break: break-word;
            line-height: 1.3;
        }
        .master-tag, .overdue-tag {
            font-size: 10px;
            background: var(--accent2);
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 4px;
            font-weight: bold;
            white-space: nowrap;
            display: inline-block;
        }
        .overdue-tag {
            background: var(--danger);
            color: #fff;
        }
        .task-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: auto;
        }
        .task-toggle-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            padding: 2px;
            opacity: 0.6;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }
        .task-toggle-btn:hover {
            opacity: 1;
            background: var(--accent2);
            border-radius: 4px;
        }
        .task-toggle-btn.expanded {
            transform: rotate(90deg);
        }
        .task-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            opacity: 0.6;
            flex-shrink: 0;
        }
        .task-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }
        .task-detail {
            display: none;
            padding: 8px;
            background: rgba(238, 127, 161, 0.05);
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text);
            border-left: 3px solid var(--accent);
        }
        .task-detail.show {
            display: block;
        }
        .task-detail-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--card);
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
            resize: vertical;
            min-height: 40px;
        }
        .task-detail-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-section-btn {
            flex: 0 0 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            color: var(--text);
            transition: 0.2s;
            min-height: 100px;
        }
        .add-section-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(238, 127, 161, 0.05);
        }

        .empty-column {
            text-align: center;
            color: #999;
            padding: 16px;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card);
            color: var(--text);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border-left: 4px solid var(--danger);
            font-family: var(--font);
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            max-width: 400px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .app-wrapper {
                flex-direction: column;
            }
            .left-panel {
                position: relative;
                top: 0;
                flex: 1 1 auto;
                max-height: none;
            }
            .dashboard-wrapper {
                overflow-x: auto;
            }
            .filter-date-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="header">
                <h1>📋 Planner</h1>
                <div class="header-controls">
                    <button class="lang-toggle" id="langToggle">ZH</button>
                    <button class="theme-toggle" id="themeToggle">🌙</button>
                </div>
            </div>

            <!-- Calendar -->
            <div class="calendar-section">
                <div class="calendar-nav">
                    <button id="prevMonthBtn">◀</button>
                    <div class="month-label" id="monthLabel"></div>
                    <button id="nextMonthBtn">▶</button>
                    <button id="todayBtn" data-i18n="today">Today</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <!-- Master Task Section -->
            <div class="master-task-section">
                <div class="master-task-header">
                    <h3 data-i18n="masterTitle">📌 Master Tasks (Week/Month)</h3>
                </div>
                <div class="master-input-container">
                    <input type="text" id="masterTaskTitle" data-i18n-ph="masterPh" placeholder="Enter task title..." />
                    <div class="master-input-row">
                        <input type="date" id="masterTaskDueDate" />
                        <button id="addMasterTaskBtn" data-i18n="add">Add</button>
                    </div>
                </div>
                <div class="master-task-list" id="masterTaskList"></div>
            </div>

            <!-- Week Toggle -->
            <div class="week-toggle-section">
                <div class="week-toggle-header" id="weekToggleHeader">
                    <h3 data-i18n="thisWeek">📅 This Week</h3>
                    <span class="arrow" id="weekArrow">▼</span>
                </div>
                <div class="week-days" id="weekDays"></div>
            </div>

            <!-- Task Filter -->
            <div class="task-filter-section">
                <div class="task-filter-header" id="filterToggleHeader">
                    <h3 data-i18n="filterTitle">🔍 Filter by Date</h3>
                    <span class="arrow" id="filterArrow">▼</span>
                </div>
                <div class="task-filter-body" id="filterBody">
                    <div class="filter-date-grid">
                        <input type="date" id="filterStartDate" />
                        <input type="date" id="filterEndDate" />
                    </div>
                    <div class="filter-actions">
                        <button class="primary" id="applyFilterBtn" data-i18n="apply">Apply</button>
                        <button id="clearFilterBtn" data-i18n="clear">Clear</button>
                    </div>
                    <div class="filter-result" id="filterResult"></div>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard-wrapper" id="dashboardWrapper">
            <div class="dashboard" id="dashboard"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Lấy ngày YYYY-MM-DD theo giờ địa phương
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        let currentLang = localStorage.getItem('plannerLang') || 'en';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDate = formatDateLocal(new Date());
        let weekOpen = false;
        let filterOpen = false;
        let filterStart = null;
        let filterEnd = null;
        let deletedDates = getDeletedDates();

        // i18n Translations
        const i18n = {
            en: {
                today: "Today",
                masterTitle: "📌 Master Tasks",
                masterPh: "Task to-do for week/month...",
                add: "Add",
                thisWeek: "📅 This Week",
                filterTitle: "🔍 Filter by Date",
                apply: "Apply",
                clear: "Clear",
                addSection: "➕ Add Section",
                noTasks: "✨ No tasks",
                addTaskPh: "+ Add task",
                taskDetailsPh: "Add task details...",
                dueLabel: "Due",
                daysLeft: "days left",
                dueToday: "Due today",
                overdue: "days overdue",
                delayLabel: "Trễ",
                daysUnit: "ngày",
                taskAdded: "✅ Task added successfully!",
                taskDeleted: "🗑️ Task deleted!",
                columnDeleted: "🗑️ Column deleted!",
                filterApplied: "🔍 Filter applied",
                filterCleared: "🧹 Filter cleared",
                enterTaskMsg: "⚠️ Please enter a task title & date!",
                confirmDeleteSection: "Delete column?",
                confirmDeleteTask: "Delete this task?",
                fromMaster: "Master",
                carriedOver: "Delayed"
            },
            zh: {
                today: "今天",
                masterTitle: "📌 汇总任务 (周/月)",
                masterPh: "输入本周/本月待办任务...",
                add: "添加",
                thisWeek: "📅 本周视图",
                filterTitle: "🔍 按日期筛选",
                apply: "应用",
                clear: "清除",
                addSection: "➕ 添加列",
                noTasks: "✨ 暂无任务",
                addTaskPh: "+ 添加任务",
                taskDetailsPh: "添加任务备注...",
                dueLabel: "截止",
                daysLeft: "天后截止",
                dueToday: "今天截止",
                overdue: "逾期",
                delayLabel: "迟到",
                daysUnit: "天",
                taskAdded: "✅ 任务添加成功！",
                taskDeleted: "🗑 任务已删除！",
                columnDeleted: "🗑 列已删除！",
                filterApplied: "🔍 已应用筛选",
                filterCleared: "🧹 已清除筛选",
                enterTaskMsg: "⚠️ 请输入任务名称和截止日期！",
                confirmDeleteSection: "确定删除此列吗？",
                confirmDeleteTask: "确定删除此任务吗？",
                fromMaster: "主任务",
                carriedOver: "顺延"
            }
        };

        function getDeletedDates() {
            try {
                return JSON.parse(localStorage.getItem('plannerDeletedDates')) || [];
            } catch {
                return [];
            }
        }

        function saveDeletedDates(dates) {
            localStorage.setItem('plannerDeletedDates', JSON.stringify(dates));
        }

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('plannerTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('plannerTheme') === 'dark') {
            document.body.classList.add('dark');
        }

        // Language Toggle
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('plannerLang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            document.getElementById('langToggle').textContent = currentLang === 'en' ? 'ZH' : 'EN/VI';
            if (currentLang === 'zh') {
                document.body.classList.add('zh-lang');
            } else {
                document.body.classList.remove('zh-lang');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.textContent = i18n[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18n[currentLang][key]) {
                    el.placeholder = i18n[currentLang][key];
                }
            });

            renderCalendar();
            renderWeekDays();
            renderMasterTasks();
            render();
        }

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.borderLeftColor = isSuccess ? '#27ae60' : 'var(--danger)';
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function getPlannerData() {
            try {
                const data = JSON.parse(localStorage.getItem('plannerData')) || { tasks: [], masterTasks: [] };
                if (!data.masterTasks) data.masterTasks = [];
                return data;
            } catch {
                return { tasks: [], masterTasks: [] };
            }
        }

        function savePlannerData(data) {
            localStorage.setItem('plannerData', JSON.stringify(data));
            window.dispatchEvent(new CustomEvent('plannerDataChanged', { detail: data }));
            render();
            renderCalendar();
            renderWeekDays();
            renderMasterTasks();
            updateFilterResult();
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'plannerData' || e.key === 'plannerDeletedDates') {
                if (e.key === 'plannerDeletedDates') deletedDates = getDeletedDates();
                render();
                renderCalendar();
                renderWeekDays();
                renderMasterTasks();
                updateFilterResult();
            }
        });

        // Tính khoảng cách ngày giữa từ targetDate tới dueDate
        function calculateDaysBetween(fromDateStr, toDateStr) {
            const start = new Date(fromDateStr + 'T00:00:00');
            const end = new Date(toDateStr + 'T00:00:00');
            const diffTime = end - start;
            return Math.round(diffTime / (1000 * 60 * 60 * 24));
        }

        // Nhãn đếm ngược ĐỘNG theo ngày của cột
        function getDynamicCountdownLabel(columnDateStr, dueDateStr) {
            const diffDays = calculateDaysBetween(columnDateStr, dueDateStr);
            const lang = i18n[currentLang];
            if (diffDays === 0) return lang.dueToday;
            if (diffDays > 0) return `${diffDays} ${lang.daysLeft}`;
            return `${Math.abs(diffDays)} ${lang.overdue}`;
        }

        function addMasterTask() {
            const titleInput = document.getElementById('masterTaskTitle');
            const dateInput = document.getElementById('masterTaskDueDate');
            const title = titleInput.value.trim();
            const dueDate = dateInput.value;

            if (!title || !dueDate) {
                showToast(i18n[currentLang].enterTaskMsg);
                return;
            }

            const data = getPlannerData();
            data.masterTasks.push({
                id: 'master_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                title: title,
                createdDate: formatDateLocal(new Date()),
                dueDate: dueDate,
                done: false
            });

            savePlannerData(data);
            titleInput.value = '';
            dateInput.value = '';
            showToast(i18n[currentLang].taskAdded, true);
        }

        function toggleMasterTask(id) {
            const data = getPlannerData();
            const task = data.masterTasks.find(m => m.id === id);
            if (task) {
                task.done = !task.done;
                savePlannerData(data);
            }
        }

        function deleteMasterTask(id) {
            if (!confirm(i18n[currentLang].confirmDeleteTask)) return;
            const data = getPlannerData();
            data.masterTasks = data.masterTasks.filter(m => m.id !== id);
            savePlannerData(data);
            showToast(i18n[currentLang].taskDeleted, true);
        }

        function renderMasterTasks() {
            const list = document.getElementById('masterTaskList');
            const data = getPlannerData();
            const masterTasks = data.masterTasks || [];
            const todayStr = formatDateLocal(new Date());

            if (masterTasks.length === 0) {
                list.innerHTML = `<div class="empty-column">${i18n[currentLang].noTasks}</div>`;
                return;
            }

            list.innerHTML = masterTasks.map(m => {
                const badgeText = getDynamicCountdownLabel(todayStr, m.dueDate);
                const diffDays = calculateDaysBetween(todayStr, m.dueDate);
                const isUrgent = diffDays <= 1;

                return `
                    <div class="master-task-item ${m.done ? 'done' : ''}">
                        <div class="master-task-title-row">
                            <span class="master-task-title">${escapeHTML(m.title)}</span>
                            <button class="task-delete" onclick="deleteMasterTask('${m.id}')">✕</button>
                        </div>
                        <div class="master-task-meta">
                            <span>📅 ${i18n[currentLang].dueLabel}: ${m.dueDate}</span>
                            <span class="countdown-badge ${isUrgent ? 'urgent' : ''}">${badgeText}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('monthLabel');

            const monthNamesEn = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];
            const monthNamesZh = ['一月', '二月', '三月', '四月', '五月', '六月',
                               '七月', '八月', '九月', '十月', '十一月', '十二月'];

            label.textContent = currentLang === 'zh'
                ? `${currentYear}年 ${monthNamesZh[currentMonth]}`
                : `${monthNamesEn[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            grid.innerHTML = '';

            const dayHeaders = currentLang === 'zh'
                ? ['日', '一', '二', '三', '四', '五', '六']
                : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            dayHeaders.forEach(day => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.textContent = day;
                grid.appendChild(el);
            });

            for (let i = firstDay - 1; i >= 0; i--) {
                const btn = document.createElement('button');
                btn.className = 'calendar-day other-month';
                btn.textContent = daysInPrevMonth - i;
                grid.appendChild(btn);
            }

            const today = formatDateLocal(new Date());
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const btn = document.createElement('button');
                btn.className = 'calendar-day';
                if (dateStr === today) btn.classList.add('today');
                if (dateStr === selectedDate) btn.classList.add('selected');
                btn.textContent = day;
                btn.dataset.date = dateStr;
                grid.appendChild(btn);
            }

            const totalCells = grid.children.length - 7;
            for (let day = 1; day <= 42 - totalCells; day++) {
                const btn = document.createElement('button');
                btn.className = 'calendar-day other-month';
                btn.textContent = day;
                grid.appendChild(btn);
            }
        }

        function renderWeekDays() {
            const container = document.getElementById('weekDays');
            const today = new Date();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay());

            container.innerHTML = '';
            const dayNames = currentLang === 'zh'
                ? ['日', '一', '二', '三', '四', '五', '六']
                : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            const todayStr = formatDateLocal(today);

            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                const dateStr = formatDateLocal(d);
                const isToday = dateStr === todayStr;
                const isSelected = dateStr === selectedDate;

                const btn = document.createElement('button');
                btn.className = `week-day-btn${isSelected ? ' active' : ''}`;
                btn.dataset.date = dateStr;
                btn.innerHTML = `
                    <span class="day-num">${d.getDate()}</span>
                    <span class="day-name-short">${dayNames[i]}</span>
                    ${isToday ? '⭐' : ''}
                `;
                container.appendChild(btn);
            }

            if (weekOpen) {
                container.classList.add('open');
                document.getElementById('weekArrow').classList.add('open');
            } else {
                container.classList.remove('open');
                document.getElementById('weekArrow').classList.remove('open');
            }
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        // Cuộn cột được chọn lên vị trí sát lề bên trái của dashboard
        function scrollToColumn(dateStr) {
            setTimeout(() => {
                const targetCol = document.querySelector(`.day-column[data-date="${dateStr}"]`);
                if (targetCol) {
                    targetCol.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
                }
            }, 50);
        }

        function goToday() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            selectedDate = formatDateLocal(today);

            if (deletedDates.includes(selectedDate)) {
                deletedDates = deletedDates.filter(d => d !== selectedDate);
                saveDeletedDates(deletedDates);
            }

            renderCalendar();
            renderWeekDays();
            render();
            scrollToColumn(selectedDate);
        }

        function selectDate(dateStr) {
            selectedDate = dateStr;

            if (deletedDates.includes(dateStr)) {
                deletedDates = deletedDates.filter(d => d !== dateStr);
                saveDeletedDates(deletedDates);
            }

            renderCalendar();
            renderWeekDays();
            render();
            scrollToColumn(selectedDate);
        }

        function addTask(dateStr, title) {
            if (!title.trim()) return;
            const data = getPlannerData();
            data.tasks.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                title: title.trim(),
                createdDate: dateStr, // Lưu đúng ngày tạo ra task
                dueDate: dateStr,
                done: false
            });
            savePlannerData(data);
            showToast(i18n[currentLang].taskAdded, true);
        }

        function toggleTask(id) {
            if (id.startsWith('master_')) {
                toggleMasterTask(id);
                return;
            }
            const data = getPlannerData();
            const task = data.tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                savePlannerData(data);
            }
        }

        function deleteTask(id) {
            if (id.startsWith('master_')) {
                deleteMasterTask(id);
                return;
            }
            if (!confirm(i18n[currentLang].confirmDeleteTask)) return;
            const data = getPlannerData();
            data.tasks = data.tasks.filter(t => t.id !== id);
            savePlannerData(data);
            showToast(i18n[currentLang].taskDeleted, true);
        }

        function deleteSection(dateStr) {
            const data = getPlannerData();
            if (!confirm(i18n[currentLang].confirmDeleteSection)) return;

            const col = document.querySelector(`.day-column[data-date="${dateStr}"]`);
            if (col) {
                col.classList.add('deleting');
                setTimeout(() => {
                    data.tasks = data.tasks.filter(t => t.createdDate !== dateStr && t.dueDate !== dateStr);
                    if (!deletedDates.includes(dateStr)) {
                        deletedDates.push(dateStr);
                        saveDeletedDates(deletedDates);
                    }
                    savePlannerData(data);
                    showToast(i18n[currentLang].columnDeleted, true);
                }, 300);
            }
        }

        function addSection() {
            const d = new Date();
            d.setDate(d.getDate() + 7);
            const dateStr = formatDateLocal(d);

            if (deletedDates.includes(dateStr)) {
                deletedDates = deletedDates.filter(d => d !== dateStr);
                saveDeletedDates(deletedDates);
            }

            selectedDate = dateStr;
            render();
            renderCalendar();
            renderWeekDays();
            scrollToColumn(selectedDate);
        }

        function applyFilter() {
            const startInput = document.getElementById('filterStartDate');
            const endInput = document.getElementById('filterEndDate');
            filterStart = startInput.value ? startInput.value : null;
            filterEnd = endInput.value ? endInput.value : null;
            updateFilterResult();
            render();
            showToast(i18n[currentLang].filterApplied, true);
        }

        function clearFilter() {
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            filterStart = null;
            filterEnd = null;
            updateFilterResult();
            render();
            showToast(i18n[currentLang].filterCleared, true);
        }

        function updateFilterResult() {
            const result = document.getElementById('filterResult');
            if (filterStart && filterEnd) {
                result.textContent = `📅 ${filterStart} → ${filterEnd}`;
            } else if (filterStart) {
                result.textContent = `📅 >= ${filterStart}`;
            } else if (filterEnd) {
                result.textContent = `📅 <= ${filterEnd}`;
            } else {
                result.textContent = '';
            }
        }

        function isDateInRange(dateStr) {
            if (!filterStart && !filterEnd) return true;
            if (!dateStr) return false;
            if (filterStart && dateStr < filterStart) return false;
            if (filterEnd && dateStr > filterEnd) return false;
            return true;
        }

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return 'Invalid Date';
            const date = new Date(dateStr + 'T00:00:00');
            if (isNaN(date.getTime())) return 'Invalid Date';
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            if (currentLang === 'zh') {
                const weekdaysZh = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return `${year}年${month}月${day}日 (${weekdaysZh[date.getDay()]})`;
            } else {
                const weekdaysEn = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')} (${weekdaysEn[date.getDay()]})`;
            }
        }

        function handleAddTaskClick(dateStr, inputElement) {
            const title = inputElement.value;
            if (!title.trim()) {
                showToast(i18n[currentLang].enterTaskMsg);
                return;
            }
            addTask(dateStr, title);
            inputElement.value = '';
            inputElement.focus();
        }

        function render() {
            const data = getPlannerData();
            const dashboard = document.getElementById('dashboard');
            const tasksByDate = {};
            const todayStr = formatDateLocal(new Date());

            // 1. Tìm khoảng hiển thị cột tối đa
            let earliestDateStr = todayStr;
            data.tasks.forEach(task => {
                const startDate = task.createdDate || task.dueDate;
                if (startDate && startDate < earliestDateStr) {
                    earliestDateStr = startDate;
                }
            });

            let maxDateObj = new Date(todayStr + 'T00:00:00');
            maxDateObj.setDate(maxDateObj.getDate() + 14);

            if (selectedDate) {
                const selectedDateObj = new Date(selectedDate + 'T00:00:00');
                if (selectedDateObj > maxDateObj) {
                    maxDateObj = selectedDateObj;
                }
            }

            const maxDisplayDate = formatDateLocal(maxDateObj);

            // 2. Map Task Daily (Chưa tick done sẽ xuất hiện từ ngày tạo đến các ngày tương lai)
            data.tasks.forEach(task => {
                const createdDate = task.createdDate || task.dueDate;
                
                if (task.done) {
                    // Task đã xong chỉ xuất hiện ở đúng ngày tạo/dueDate của nó
                    if (isDateInRange(createdDate)) {
                        if (!tasksByDate[createdDate]) tasksByDate[createdDate] = [];
                        tasksByDate[createdDate].push({
                            ...task,
                            isCarriedOver: false,
                            overdueDays: 0
                        });
                    }
                } else {
                    // Task chưa xong sẽ tự lặp/chuyển giao qua từng ngày
                    let curr = new Date(createdDate + 'T00:00:00');
                    const end = new Date(maxDisplayDate + 'T00:00:00');

                    while (curr <= end) {
                        const dateStr = formatDateLocal(curr);
                        if (isDateInRange(dateStr)) {
                            if (!tasksByDate[dateStr]) tasksByDate[dateStr] = [];
                            
                            const overdueDays = calculateDaysBetween(createdDate, dateStr);
                            const isCarriedOver = overdueDays > 0;

                            tasksByDate[dateStr].push({
                                ...task,
                                isCarriedOver: isCarriedOver,
                                overdueDays: overdueDays
                            });
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                }
            });

            // 3. Map Master Task (Tự hiển thị từ ngày tạo/hôm nay đến ngày Deadline)
            const masterTasks = data.masterTasks || [];
            masterTasks.forEach(master => {
                if (!master.dueDate) return;

                const startFrom = master.createdDate || todayStr;
                let startDate = startFrom < master.dueDate ? startFrom : master.dueDate;
                
                // Nếu chưa hoàn thành thì kéo dài vô tận sang các ngày sau
                let endDate = master.done ? master.dueDate : maxDisplayDate;

                let curr = new Date(startDate + 'T00:00:00');
                const last = new Date(endDate + 'T00:00:00');

                while (curr <= last) {
                    const dateStr = formatDateLocal(curr);
                    if (isDateInRange(dateStr)) {
                        if (!tasksByDate[dateStr]) {
                            tasksByDate[dateStr] = [];
                        }

                        // Đếm ngược ĐỘNG theo ngày của cột này (dateStr)
                        const countdownLabel = getDynamicCountdownLabel(dateStr, master.dueDate);

                        tasksByDate[dateStr].push({
                            id: master.id,
                            title: master.title,
                            dueDate: dateStr,
                            masterDueDate: master.dueDate,
                            done: master.done,
                            isMaster: true,
                            countdownLabel: countdownLabel
                        });
                    }
                    curr.setDate(curr.getDate() + 1);
                }
            });

            // Gom tất cả các ngày cần hiển thị
            const dates = new Set();
            let currRangeDate = new Date(earliestDateStr + 'T00:00:00');
            let endRangeDate = new Date(todayStr + 'T00:00:00');
            endRangeDate.setDate(endRangeDate.getDate() + 6);

            while (currRangeDate <= endRangeDate) {
                const dateStr = formatDateLocal(currRangeDate);
                if (isDateInRange(dateStr) && !deletedDates.includes(dateStr)) {
                    dates.add(dateStr);
                }
                currRangeDate.setDate(currRangeDate.getDate() + 1);
            }

            if (selectedDate && isDateInRange(selectedDate) && !deletedDates.includes(selectedDate)) {
                dates.add(selectedDate);
            }

            Object.keys(tasksByDate).forEach(date => {
                if (date && isDateInRange(date) && !deletedDates.includes(date)) {
                    dates.add(date);
                }
            });

            const sortedDates = Array.from(dates).sort();

            if (sortedDates.length === 0 && isDateInRange(todayStr) && !deletedDates.includes(todayStr)) {
                sortedDates.push(todayStr);
            }

            dashboard.innerHTML = sortedDates.map(dateStr => {
                let tasks = (tasksByDate[dateStr] || []);

                tasks = tasks.sort((a, b) => {
                    if (a.done === b.done) return 0;
                    return a.done ? 1 : -1;
                });

                const isHighlighted = dateStr === selectedDate;

                return `
                    <div class="day-column${isHighlighted ? ' highlight' : ''}" data-date="${dateStr}">
                        <div class="day-header">
                            <div class="day-header-title">${formatDateDisplay(dateStr)}</div>
                            <div class="section-actions">
                                <button class="delete-column-btn" data-date="${dateStr}" title="Delete entire column">✕</button>
                            </div>
                        </div>
                        <div class="tasks-container">
                            <div class="task-input-row">
                                <input type="text" placeholder="${i18n[currentLang].addTaskPh}" class="task-input" data-date="${dateStr}" />
                                <button class="add-task-btn" data-date="${dateStr}">➕</button>
                            </div>
                            ${tasks.map(task => {
                                let delayText = '';
                                if (task.isCarriedOver) {
                                    delayText = currentLang === 'zh'
                                        ? `⚠️ 迟到 ${task.overdueDays} 天`
                                        : `⚠️ Trễ ${task.overdueDays} ngày`;
                                }
                                return `
                                <div class="task-item ${task.done ? 'done' : ''} ${task.isMaster ? 'master-derived' : ''} ${task.isCarriedOver ? 'carried-over' : ''}">
                                    <div class="task-item-header">
                                        <input type="checkbox" class="task-checkbox task-toggle" data-id="${task.id}" ${task.done ? 'checked' : ''} />
                                        <div style="flex: 1;">
                                            <div class="task-text">
                                                ${escapeHTML(task.title)}${task.isMaster ? `<span class="master-tag">${i18n[currentLang].fromMaster}: ${task.countdownLabel}</span>` : ''}
                                                ${task.isCarriedOver ? `<span class="overdue-tag">${delayText}</span>` : ''}
                                            </div>
                                        </div>
                                        <div class="task-actions">
                                            <button class="task-toggle-btn" data-id="${task.id}">▶</button>
                                            <button class="task-delete" data-id="${task.id}">✕</button>
                                        </div>
                                    </div>
                                    <div class="task-detail" data-id="${task.id}">
                                        <textarea class="task-detail-input" data-id="${task.id}" placeholder="${i18n[currentLang].taskDetailsPh}"></textarea>
                                    </div>
                                </div>
                            `}).join('')}
                            ${!tasks.length ? `<div class="empty-column">${i18n[currentLang].noTasks}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            dashboard.innerHTML += `
                <button class="add-section-btn" id="addSectionBtn">${i18n[currentLang].addSection}</button>
            `;

            // Event Listeners for inline inputs
            document.querySelectorAll('.add-task-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const dateStr = this.dataset.date;
                    const input = this.parentElement.querySelector('.task-input');
                    handleAddTaskClick(dateStr, input);
                });
            });

            document.querySelectorAll('.task-input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const dateStr = this.dataset.date;
                        const btn = this.parentElement.querySelector('.add-task-btn');
                        if (btn) btn.click();
                    }
                });
            });
        }

        const taskDetails = {};

        function toggleTaskDetail(taskId) {
            const detailEl = document.querySelector(`.task-detail[data-id="${taskId}"]`);
            const toggleBtn = document.querySelector(`.task-toggle-btn[data-id="${taskId}"]`);

            if (detailEl) {
                detailEl.classList.toggle('show');
                if (toggleBtn) toggleBtn.classList.toggle('expanded');
            }
        }

        function saveTaskDetail(taskId, detail) {
            taskDetails[taskId] = detail;
            localStorage.setItem('taskDetails', JSON.stringify(taskDetails));
        }

        function loadTaskDetails() {
            try {
                const stored = localStorage.getItem('taskDetails');
                Object.assign(taskDetails, stored ? JSON.parse(stored) : {});
            } catch (e) {
                console.error('Error loading details:', e);
            }
        }

        loadTaskDetails();

        // Global Event Delegation
        document.addEventListener('click', (e) => {
            if (e.target.closest('.delete-column-btn')) {
                const btn = e.target.closest('.delete-column-btn');
                deleteSection(btn.dataset.date);
                return;
            }

            if (e.target.id === 'addSectionBtn') {
                addSection();
                return;
            }

            if (e.target.classList.contains('task-delete')) {
                deleteTask(e.target.dataset.id);
                return;
            }

            if (e.target.classList.contains('task-toggle')) {
                toggleTask(e.target.dataset.id);
                return;
            }

            if (e.target.classList.contains('task-toggle-btn')) {
                e.preventDefault();
                toggleTaskDetail(e.target.dataset.id);
                return;
            }

            if (e.target.classList.contains('calendar-day') && !e.target.classList.contains('other-month')) {
                const dateStr = e.target.dataset.date;
                if (dateStr) selectDate(dateStr);
                return;
            }

            if (e.target.closest('.week-day-btn')) {
                const btn = e.target.closest('.week-day-btn');
                if (btn.dataset.date) selectDate(btn.dataset.date);
                return;
            }
        });

        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('task-detail-input')) {
                saveTaskDetail(e.target.dataset.id, e.target.value);
            }
        });

        const originalRender = render;
        render = function() {
            originalRender();
            Object.keys(taskDetails).forEach(taskId => {
                const textarea = document.querySelector(`.task-detail-input[data-id="${taskId}"]`);
                if (textarea) textarea.value = taskDetails[taskId];
            });
        };

        // Master task listeners
        document.getElementById('addMasterTaskBtn').addEventListener('click', addMasterTask);

        ['masterTaskTitle', 'masterTaskDueDate'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addMasterTask();
                }
            });
        });

        // Toggle sections
        document.getElementById('weekToggleHeader').addEventListener('click', function() {
            weekOpen = !weekOpen;
            document.getElementById('weekDays').classList.toggle('open');
            document.getElementById('weekArrow').classList.toggle('open');
        });

        document.getElementById('filterToggleHeader').addEventListener('click', function() {
            filterOpen = !filterOpen;
            document.getElementById('filterBody').classList.toggle('open');
            document.getElementById('filterArrow').classList.toggle('open');
        });

        // Filter buttons
        document.getElementById('applyFilterBtn').addEventListener('click', applyFilter);
        document.getElementById('clearFilterBtn').addEventListener('click', clearFilter);

        // Theme and Controls
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('langToggle').addEventListener('click', toggleLang);
        document.getElementById('prevMonthBtn').addEventListener('click', prevMonth);
        document.getElementById('nextMonthBtn').addEventListener('click', nextMonth);
        document.getElementById('todayBtn').addEventListener('click', goToday);

        // Initialization
        applyLanguage();
        scrollToColumn(selectedDate);
    </script>
</body>
</html>
